# Notification dispatcher — podsetnici za doze i streak-at-risk.
#
# Zašto GitHub Actions: /api/cron/notifications mora da se poziva na 15 min (vremena
# doza su individualna), a Vercel Cron na Hobby planu vozi samo dnevne rasporede.
# Repo je public, pa su Actions minuti besplatni i neograničeni.
#
# Setup (jednom): Settings → Secrets and variables → Actions → New repository secret
#   CRON_SECRET = ista vrednost kao na Vercelu
# Opciono: Variables → APP_URL ako domen nije https://app.nurolab.rs
#
# Test odmah: Actions → "Notification dispatcher" → Run workflow.

name: Notification dispatcher

on:
  schedule:
    # Na 15 min. Prozor podsetnika je 30 min, pa jedan propušten run ne gubi
    # notifikaciju — sledeći je i dalje unutar prozora.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Ako se prethodni run oduži, ne gomilaj paralelne pozive.
concurrency:
  group: notifications-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pozovi dispatcher
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://app.nurolab.rs' }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET repo secret nije postavljen (Settings → Secrets and variables → Actions)."
            exit 1
          fi

          # Bez -L: redirect bi značio pogrešan APP_URL, i bolje je da to pukne
          # glasno nego da Authorization header tiho ode na drugi host.
          response=$(curl -sS -m 30 -w $'\n%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/notifications")

          code=$(printf '%s' "${response}" | tail -n1)
          body=$(printf '%s' "${response}" | sed '$d')

          echo "HTTP ${code}"
          echo "${body}"

          case "${code}" in
            200) ;;
            401) echo "::error::401 — CRON_SECRET u GitHub-u se ne poklapa sa onim na Vercelu."; exit 1 ;;
            3??) echo "::error::${code} redirect — proveri APP_URL (${APP_URL})."; exit 1 ;;
            *)   echo "::error::Dispatcher vratio ${code}."; exit 1 ;;
          esac
